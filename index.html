  <meta name="theme-color" content="#f5f2ec">
  <script>
    /* Đặt theme trước khi vẽ để không bị nháy trắng */
    (function () {
      try {
        var t = localStorage.getItem('gentsuki.theme');
        if (!t && window.matchMedia) {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (t === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) { m.setAttribute('content', '#14120f'); }
        }
      } catch (e) { /* bỏ qua */ }
    })();
  </script>

  <script>
    /* Chỉ đăng ký service worker khi chạy qua http(s) — mở file:// sẽ bỏ qua */
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      /* Một lần duy nhất cho mỗi bản: gỡ service worker cũ + xoá cache,
         để không còn cảnh "đã lên bản mới mà vẫn chạy bản cũ". */
      (function () {
        var FLAG = 'gentsuki.swreset';
        var done = false;
        try { done = localStorage.getItem(FLAG) === '65'; } catch (e) { }
        if (done) { return; }
        try {
          localStorage.setItem(FLAG, '65');
          /* nếu không ghi được (chế độ riêng tư) thì bỏ qua, tránh reload vô hạn */
          if (localStorage.getItem(FLAG) !== '65') { return; }
        } catch (e) { return; }
        Promise.resolve()
          .then(function () { return navigator.serviceWorker.getRegistrations(); })
          .then(function (regs) { return Promise.all(regs.map(function (r) { return r.unregister(); })); })
          .then(function () { return caches.keys(); })
          .then(function (keys) { return Promise.all(keys.map(function (k) { return caches.delete(k); })); })
          .then(function () { location.reload(); })
          .catch(function () { });
        return;
      })();

      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(function (reg) {
          reg.update();
        }).catch(function () { /* bỏ qua */ });
        var swReloaded = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (swReloaded) { return; }
          swReloaded = true;
          try {
            if (sessionStorage.getItem('gentsuki.reloaded') === '1') { return; }
            sessionStorage.setItem('gentsuki.reloaded', '1');
          } catch (err) { }
          location.reload();
        });
      });
    }
  </script>
